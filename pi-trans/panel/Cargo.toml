[package]
name = "pi-trans-panel"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tao = "0.37.2"
wry = "0.57.1"
serde_json = "1"
arboard = { version = "3.6", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSScreen"] }
